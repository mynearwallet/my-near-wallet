name: Deploy Testnet

on:
  push:
    branches:
      - testnet
  # Manual redeploys, e.g. after changing the SUNSET_PHASE environment variable.
  workflow_dispatch:

concurrency:
  group: 'testnet'
  cancel-in-progress: true

jobs:
  testnet-live-deploy:
    # A manual run can pick any branch; only the testnet branch may reach production testnet.
    if: github.ref == 'refs/heads/testnet'
    uses: ./.github/workflows/cloudflare-pages-deploy.yml
    with:
      environment: testnet
      near_wallet_env: testnet
    secrets: inherit
