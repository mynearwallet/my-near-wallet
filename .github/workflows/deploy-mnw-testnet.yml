name: Deploy Testnet

on:
  push:
    branches:
      - testnet
  # Manual redeploys, e.g. after changing the SUNSET_PHASE environment variable.
  workflow_dispatch:

concurrency:
  group: 'testnet'
  cancel-in-progress: true

jobs:
  testnet-live-deploy:
    uses: ./.github/workflows/cloudflare-pages-deploy.yml
    with:
      environment: testnet
      near_wallet_env: testnet
    secrets: inherit
