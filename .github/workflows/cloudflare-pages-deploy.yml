name: Cloudflare Pages Build and Publish

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      near_wallet_env:
        required: true
        type: string

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      NEAR_WALLET_ENV: ${{ inputs.near_wallet_env }}
      # MyNearWallet sunset phase (1-3). Set per GitHub environment; when unset the build uses
      # the default in packages/frontend/src/config/environmentDefaults.
      SUNSET_PHASE: ${{ vars.SUNSET_PHASE }}
    name: Build and Publish to Cloudflare Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20.19.x
          cache: 'yarn'
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn test
      - working-directory: packages/frontend
        run: yarn bundle --distDir=dist/${{ inputs.environment }}

      # Wrangler v4 needs Node 22; the build above stays on Node 20.
      - name: Setup Node for Wrangler
        uses: actions/setup-node@v3
        with:
          node-version: 22.x
      # Installed globally so wrangler-action uses it instead of installing Wrangler into the yarn
      # workspace, which would run `npm i` across the whole monorepo.
      - run: npm install --global wrangler@4.151.3

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          workingDirectory: packages/frontend
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/${{ inputs.environment }} --project-name=app-page-${{ inputs.environment }} --branch=main
          # Optional: Enable this if you want to have GitHub Deployments triggered
#          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
