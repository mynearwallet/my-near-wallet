name: Deploy Mainnet

on:
  push:
    branches:
      - mainnet
  # Manual redeploys, e.g. after changing the SUNSET_PHASE environment variable.
  workflow_dispatch:

concurrency:
  group: 'mainnet'
  cancel-in-progress: true

jobs:
  mainnet-deploy:
    uses: ./.github/workflows/cloudflare-pages-deploy.yml
    with:
      environment: mainnet
      near_wallet_env: mainnet
    secrets: inherit
