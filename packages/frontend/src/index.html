<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <link rel="shortcut icon" href="./favicon.svg" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, shrink-to-fit=no"
        />
        <meta name="theme-color" content="#000000" />
        <meta name="referrer" content="strict-origin-when-cross-origin" />
        <!--
            Content Security Policy:
            - object-src 'none'  : blocks Flash and other plugin content
            - base-uri 'self'    : prevents base-tag hijacking attacks
            - script-src includes 'unsafe-inline' due to the inline recaptchaOptions
              script below and because react-google-recaptcha injects scripts at runtime.
              If that script is moved into the bundle, 'unsafe-inline' can be removed.
            - connect-src https: wss: allows all TLS API/RPC/WS calls (NEAR RPC,
              indexers, Sentry, Mixpanel, MoonPay, etc.) without maintaining a
              fragile allowlist that breaks on new integrations.
        -->
        <meta
            http-equiv="Content-Security-Policy"
            content="
                default-src 'self';
                script-src 'self' 'unsafe-inline'
                    https://www.google.com
                    https://www.gstatic.com
                    https://recaptcha.net
                    https://sdk.gleap.io;
                connect-src 'self' https: wss:;
                img-src 'self' data: https: blob:;
                style-src 'self' 'unsafe-inline';
                font-src 'self' data:;
                frame-src
                    https://www.google.com
                    https://recaptcha.net;
                object-src 'none';
                base-uri 'self';
            "
        />
        <meta
            name="google-site-verification"
            content="CLYr3n4Y0ZCVgjur0noRGJzN4VxPsHOaNJzydYQ0IF0"
        />
        <title>MyNearWallet</title>
        <link href="./index.css" rel="stylesheet" />
    </head>

    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        <div id="modal-root"></div>
        <!--
            This HTML file is a template.
            If you open it directly in the browser, you will see an empty page.

            You can add webfonts, meta tags, or analytics to this file.
            The build step will place the bundled scripts into the <body> tag.

            To begin the development, run `npm start` or `yarn start`.
            To create a production bundle, use `npm run build` or `yarn build`.
        -->
        <script type="module" type="application/javascript">
            // react-google-recaptcha Use `recaptcha.net` rather than `google.com` for international recaptcha
            window.recaptchaOptions = { useRecaptchaNet: true };
        </script>
        <script type="module" src="./index.tsx"></script>
    </body>
</html>
